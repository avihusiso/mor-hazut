<section class="mx-auto max-w-3xl px-6 pt-32 pb-20 md:px-10 md:pt-40 md:pb-28">
  <app-section-heading
    [level]="1"
    [eyebrow]="i18n.t('faq.eyebrow')"
    [title]="i18n.t('faq.title')"
    [subtitle]="i18n.t('faq.subtitle')"
  />

  <div class="flex flex-col">
    @for (item of items; track item.id; let i = $index) {
      <div appFadeIn [appFadeInDelay]="(i % 4) * 60" class="border-b border-beige-dark/50">
        <h2>
          <button
            type="button"
            [id]="'faq-btn-' + item.id"
            [attr.aria-expanded]="isOpen(item.id)"
            [attr.aria-controls]="'faq-panel-' + item.id"
            (click)="toggle(item.id)"
            class="flex w-full cursor-pointer items-center justify-between gap-4 py-5 text-start"
          >
            <span class="text-base font-medium text-charcoal md:text-lg">{{ i18n.pick(item.question) }}</span>
            <app-icon
              name="chevron-down"
              class="h-5 w-5 shrink-0 text-gold-deep transition-transform duration-300"
              [class.rotate-180]="isOpen(item.id)"
            />
          </button>
        </h2>
        <div
          [id]="'faq-panel-' + item.id"
          role="region"
          [attr.aria-labelledby]="'faq-btn-' + item.id"
          class="accordion-panel"
          [class.is-open]="isOpen(item.id)"
        >
          <div>
            <p class="pb-5 leading-relaxed text-charcoal-soft">{{ i18n.pick(item.answer) }}</p>
          </div>
        </div>
      </div>
    }
  </div>

  <div appFadeIn class="mt-16 flex flex-col items-center gap-4 bg-surface px-8 py-12 text-center">
    <p class="text-lg font-medium text-charcoal">{{ i18n.t('faq.stillHaveQuestions') }}</p>
    <a routerLink="/" fragment="contact" appScrollToFragment="contact" class="btn-outline !px-6 !py-3 text-xs">
      {{ i18n.t('faq.contactCta') }}
    </a>
  </div>
</section>
